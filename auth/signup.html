<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Account — Remotely Philippines</title>
    <meta name="description" content="Request a Remotely Philippines Virtual Workspace account.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/auth.css">
</head>
<body>

    <!-- Header -->
    <div class="auth-header">
        <a href="../index.html">
            <img src="../tilesets/RemotelyLogo.png" alt="Remotely Philippines Logo" class="logo">
        </a>
    </div>

    <!-- Card -->
    <div class="auth-card">
        <h1>Request <span>Account</span></h1>
        <p class="subtitle">Fill in your details and we'll set you up once your request is reviewed.</p>

        <form id="signup-form" novalidate>

            <div class="form-group">
                <label for="full-name">Full Name</label>
                <input
                    type="text"
                    id="full-name"
                    name="full-name"
                    placeholder="e.g. Juan dela Cruz"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="department">Department</label>
                <div class="select-wrapper">
                    <select id="department" name="department" required>
                        <option value="" disabled selected>Select your department</option>
                        <option value="Engineering">Engineering</option>
                        <option value="Design">Design</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Operations">Operations</option>
                        <option value="HR">HR</option>
                        <option value="Finance">Finance</option>
                        <option value="Sales">Sales</option>
                        <option value="Customer Support">Customer Support</option>
                        <option value="IT">IT</option>
                        <option value="Management">Management</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn-primary" id="submit-btn">
                Request Account
            </button>

        </form>

        <!-- Status messages -->
        <div class="status-msg" id="status-msg" role="alert" aria-live="polite"></div>
    </div>

    <!-- Footer -->
    <p class="auth-footer">
        Already have an account? <a href="login.html">Sign in</a>
    </p>

    <script type="module">
        import { requestAccount } from '../js/auth.js';

        const form      = document.getElementById('signup-form');
        const submitBtn = document.getElementById('submit-btn');
        const statusMsg = document.getElementById('status-msg');

        function showStatus(message, type) {
            statusMsg.textContent = message;
            statusMsg.className   = `status-msg show ${type}`;
        }

        function setLoading(loading) {
            if (loading) {
                submitBtn.disabled   = true;
                submitBtn.innerHTML  = '<span class="spinner"></span> Submitting…';
            } else {
                submitBtn.disabled   = false;
                submitBtn.textContent = 'Request Account';
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            statusMsg.className = 'status-msg';   // hide previous

            const fullName   = document.getElementById('full-name').value.trim();
            const department = document.getElementById('department').value;

            // Client-side validation
            if (!fullName) {
                showStatus('Please enter your full name.', 'error');
                document.getElementById('full-name').focus();
                return;
            }
            if (!department) {
                showStatus('Please select your department.', 'error');
                document.getElementById('department').focus();
                return;
            }

            setLoading(true);

            try {
                await requestAccount(fullName, department);
                form.reset();
                showStatus(
                    'Your request has been submitted. Your credentials will be sent to you once approved.',
                    'success'
                );
            } catch (err) {
                showStatus(err.message || 'An unexpected error occurred. Please try again.', 'error');
            } finally {
                setLoading(false);
            }
        });
    </script>

</body>
</html>
